<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LOCALOCR{% endblock %}</title>

  <!-- Zero-build stack: Tailwind + HTMX from CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>

  <style>
    /* Walmart palette (per cp_walmart_colors skill). Dark theme by default. */
    :root {
      --wm-blue-100: #0053e2;   /* primary */
      --wm-blue-110: #0047c4;   /* primary hover  (+10) */
      --wm-blue-130: #003399;   /* primary pressed (+30) */
      --wm-spark-100: #ffc220;  /* accent */
      --wm-red-100: #ea1100;    /* error / destructive */
      --wm-green-100: #2a8703;  /* success */
      --wm-spark-140: #995213;  /* warning text */
      --wm-spark-10: #fff4d1;   /* warning bg */

      /* Dark theme surface tokens */
      --bg:        #0b0f14;
      --surface:   #141a22;
      --surface-2: #1c242e;
      --border:    #2a3441;
      --text:      #e6e9ee;
      --text-muted:#9aa4b2;
    }

    body[data-theme="dark"] {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
    }

    /* Focus ring -- WCAG 2.4.7 focus-visible + 3:1 contrast against dark surfaces */
    :focus-visible {
      outline: 3px solid var(--wm-spark-100);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* Skip-to-content link (WCAG 2.4.1) */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: 8px;
      background: var(--wm-spark-100);
      color: #000;
      padding: 8px 16px;
      font-weight: 600;
      z-index: 100;
      border-radius: 4px;
    }
    .skip-link:focus {
      left: 8px;
    }

    /* Button primitives */
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .55rem 1rem; border-radius: 6px; font-weight: 600;
      transition: background .15s ease, color .15s ease;
      cursor: pointer; text-decoration: none;
      border: 1px solid transparent;
    }
    .btn-primary { background: var(--wm-blue-100); color: white; }
    .btn-primary:hover { background: var(--wm-blue-110); }
    .btn-primary:active { background: var(--wm-blue-130); }
    .btn-secondary {
      background: transparent; color: var(--text);
      border-color: var(--border);
    }
    .btn-secondary:hover { background: var(--surface-2); }
    .btn-destructive { background: var(--wm-red-100); color: white; }
    .btn-destructive:hover { background: #c50e00; }

    /* Status badges */
    .badge {
      display: inline-block; padding: .2rem .55rem; border-radius: 999px;
      font-size: .72rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .04em;
    }
    .badge-running    { background: #1e3a5f; color: #8ab4f8; }
    .badge-completed  { background: #143a1a; color: #7dd87d; }
    .badge-failed     { background: #4a0f0f; color: #ff8a80; }
    .badge-interrupted{ background: #3a2e0f; color: var(--wm-spark-100); }
    .badge-queued     { background: #2a2f3a; color: var(--text-muted); }
  </style>

  {% block head %}{% endblock %}
</head>
<body data-theme="dark" class="min-h-screen">
  <a href="#main" class="skip-link">Skip to main content</a>

  <header class="border-b" style="border-color: var(--border); background: var(--surface);">
    <nav class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between"
         aria-label="Primary">
      <a href="/runs" class="flex items-center gap-2 font-bold text-lg"
         style="color: var(--wm-spark-100);">
        <span aria-hidden="true">*</span> LOCALOCR
      </a>
      <ul class="flex items-center gap-2 list-none m-0 p-0">
        <li><a href="/runs" class="btn btn-secondary">Runs</a></li>
        <li><a href="/runs/new" class="btn btn-primary">New Run</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="max-w-6xl mx-auto px-4 py-6 text-sm"
          style="color: var(--text-muted);">
    LOCALOCR v1.1 &middot; Local video screen OCR
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
