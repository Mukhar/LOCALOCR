[pytest]
markers =
    e2e: slow end-to-end tests (Playwright browser). Skipped by default.
         Run explicitly with:  pytest -m e2e tests/e2e/
         Requires: pytest-playwright + `playwright install chromium`.

# Default test run excludes e2e so the unit suite stays fast.
# Override with `pytest -m e2e` or `pytest -m "e2e or not e2e"`.
addopts = -m "not e2e"

asyncio_mode = strict
